# Host Supabase và anon key (công khai) được điền vào lúc build (xem Dockerfile)

# API cho Major OS: tối đa 60 lần gọi / phút (sau Cloudflare + proxy Coolify nên gần như tính chung)
limit_req_zone $binary_remote_addr zone=majoros:1m rate=60r/m;

# Key Major OS: lấy từ "Authorization: Bearer <key>", hoặc header riêng "X-Major-Key"
map $http_authorization $major_os_key {
  ""      $http_x_major_key;
  default $http_authorization;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # File build có hash trong tên → cache lâu
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Major OS đọc báo cáo — chuyển tiếp sang hàm Postgres trên Supabase (docs/major-os.md)
  location /api/major-os/ {
    limit_req zone=majoros burst=20 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $supabase_host "__SUPABASE_HOST__";

    rewrite ^/api/major-os/su-dung/?$ /rest/v1/rpc/major_os_su_dung break;
    rewrite ^/api/major-os/canh-bao/?$ /rest/v1/rpc/major_os_canh_bao break;
    rewrite ^/api/major-os/tinh-nang/?$ /rest/v1/rpc/major_os_tinh_nang break;
    return 404;

    proxy_pass https://$supabase_host;
    proxy_ssl_server_name on;
    proxy_set_header Host $supabase_host;
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_set_header x-major-key $major_os_key;
    proxy_set_header Accept "application/json";
    proxy_hide_header Content-Location;
    proxy_hide_header Content-Range;
    add_header Cache-Control "no-store" always;
  }

  # SPA: mọi route (vd /admin, /reset-password) trả về index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
